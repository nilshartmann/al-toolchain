name: Build image

# Builds only when the image changes, and by hand.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two images from the stages of the Dockerfile: IMAGE from "toolchain", KUBERNETES from "kubernetes".
env:
  IMAGE: ghcr.io/nilshartmann/al-toolchain
  KUBERNETES: ghcr.io/nilshartmann/al-toolchain-kubernetes

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: toolchain
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - name: Check image
        run: docker run --rm -i --user 12345:12345 "${IMAGE}@${{ steps.build.outputs.digest }}" sh -s < scripts/check.sh
      - id: build-kubernetes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: kubernetes
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.KUBERNETES }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.runner }}-kubernetes
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}-kubernetes
      - name: Check image with kubectl and Helm
        run: |
          ref="${KUBERNETES}@${{ steps.build-kubernetes.outputs.digest }}"
          docker run --rm -i --user 12345:12345 "$ref" sh -s < scripts/check.sh
          docker run --rm -i --user 12345:12345 "$ref" sh -s < scripts/check-kubernetes.sh
      - name: Remember digests
        run: |
          mkdir -p /tmp/digests/toolchain /tmp/digests/kubernetes
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/toolchain/${digest#sha256:}"
          digest="${{ steps.build-kubernetes.outputs.digest }}"
          touch "/tmp/digests/kubernetes/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create one entry for both architectures
        working-directory: /tmp/digests
        run: |
          for pair in "toolchain ${IMAGE}" "kubernetes ${KUBERNETES}"; do
            stage="${pair%% *}"; image="${pair#* }"
            refs=""
            for digest in "$stage"/*; do refs="$refs ${image}@sha256:${digest#"$stage"/}"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "${image}:latest" -t "${image}:sha-${GITHUB_SHA::12}" $refs
          done
      - name: Print digests
        run: |
          for image in "$IMAGE" "$KUBERNETES"; do
            digest="$(docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA::12}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${image}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
